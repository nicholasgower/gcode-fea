[project]
name = "gcode-fea"
version = "0.1.0"
description = "Export as-deposited FFF bead mesostructure for finite element analysis"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
step = ["gmsh>=4.15"]
trim = ["shapely>=2.0"]
dev = ["pytest>=8"]

[project.scripts]
gcode-fea = "gcode_fea.cli:main"
gcode-fea-benchmark = "gcode_fea.benchmark_cli:main"
gcode-fea-cohesive = "gcode_fea.cohesive_cli:main"
gcode-fea-process = "gcode_fea.process_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gcode_fea"]

[tool.pytest.ini_options]
testpaths = ["tests"]
