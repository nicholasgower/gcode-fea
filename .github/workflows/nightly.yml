name: Nightly plugin build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-plugin
  cancel-in-progress: false

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gmsh runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglu1-mesa libgl1 libxrender1 libxft2 libxinerama1 \
            libxcursor1 libxfixes3

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --locked

      - name: Run unit tests
        run: uv run python -m unittest discover -s tests -p "test_*.py"

  nightly:
    name: Publish nightly wheel
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build plugin wheel
        run: python3 helper_scripts/build_plugin_wheel.py --out dist

      - name: Write nightly release notes
        run: |
          {
            echo "## GCode-FEA nightly build"
            echo
            echo "Automated build from \`main\`."
            echo
            echo "- Commit: [\`$GITHUB_SHA\`](https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA)"
            echo "- Built: $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo
            echo "**Latest commit:** $(git log -1 --pretty=%s)"
            echo
            echo "This is a prerelease from the latest commit and may be unstable."
            echo
            echo "Download the attached wheel and install it with OrcaSlicer's **Install local plugin**."
          } > nightly-notes.md

      - name: Move the nightly tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f nightly "$GITHUB_SHA"
          git push --force origin refs/tags/nightly

      - name: Publish or update the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly \
              --prerelease \
              --title "GCode-FEA nightly" \
              --notes-file nightly-notes.md
            gh release upload nightly dist/*.whl --clobber
          else
            gh release create nightly dist/*.whl \
              --prerelease \
              --title "GCode-FEA nightly" \
              --notes-file nightly-notes.md
          fi
